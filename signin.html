<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — NEXORA AI</title>
  <meta name="description" content="Sign in to your NEXORA AI intelligent workspace." />
  <meta name="theme-color" content="#0a0b10" />

  <!-- Open Graph -->
  <meta property="og:title" content="Sign In — NEXORA AI" />
  <meta property="og:description" content="Sign in to your NEXORA AI intelligent workspace." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://www.nexora.ai/signin.html" />

  <link rel="stylesheet" href="style.css" />
</head>
<body class="signin-body">

  <div class="signin-bg" aria-hidden="true">
    <span class="signin-bg__grid"></span>
    <span class="signin-bg__orb signin-bg__orb--1"></span>
    <span class="signin-bg__orb signin-bg__orb--2"></span>
  </div>

  <header class="signin-header container">
    <a href="index.html" class="back-link">
      <span aria-hidden="true">←</span> Back to NEXORA AI
    </a>
  </header>

  <main class="signin-main">
    <div class="signin-card">

      <a href="index.html" class="brand signin-brand" aria-label="NEXORA AI home">
        <span class="brand__mark" aria-hidden="true">
          <span class="brand__node brand__node--1"></span>
          <span class="brand__node brand__node--2"></span>
          <span class="brand__node brand__node--3"></span>
        </span>
        <span class="brand__name">NEXORA<span class="brand__name-accent">AI</span></span>
      </a>

      <h1 class="signin-heading">Welcome back</h1>
      <p class="signin-sub">Sign in to continue to your intelligent workspace.</p>

      <form class="signin-form">

        <div class="form-field">
          <label for="email">Email address</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="you@example.com"
            autocomplete="email"
            required
          >
        </div>

        <div class="form-field">
          <div class="form-field__row">
            <label for="password">Password</label>
            <a href="#" class="forgot-link">Forgot password?</a>
          </div>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
          >
        </div>

        <div class="form-remember">
          <input type="checkbox" id="remember" name="remember" />
          <label for="remember">Remember me</label>
        </div>

        <button type="submit" class="btn btn--primary btn--full btn--lg">Sign In</button>
      </form>

      <div class="signin-divider">
        <span>or continue with</span>
      </div>

      <div class="social-buttons">
        <a href="#" class="btn btn--ghost btn--full social-btn">
          <span class="social-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path fill="#EA4335" d="M12 10.2v3.9h5.5c-.24 1.4-1.7 4.1-5.5 4.1-3.3 0-6-2.7-6-6.2s2.7-6.2 6-6.2c1.9 0 3.1.8 3.8 1.5l2.6-2.5C16.9 3.3 14.7 2.3 12 2.3 6.9 2.3 2.7 6.5 2.7 12s4.2 9.7 9.3 9.7c5.4 0 8.9-3.8 8.9-9.1 0-.6-.1-1.1-.1-1.5H12Z"/>
            </svg>
          </span>
          Continue with Google
        </a>
        <a href="#" class="btn btn--ghost btn--full social-btn">
          <span class="social-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
              <path d="M12 2C6.48 2 2 6.58 2 12.2c0 4.5 2.87 8.32 6.84 9.67.5.1.68-.22.68-.49 0-.24-.01-1.03-.01-1.87-2.78.61-3.37-1.19-3.37-1.19-.45-1.17-1.11-1.48-1.11-1.48-.9-.63.07-.62.07-.62 1 .07 1.53 1.05 1.53 1.05.89 1.54 2.34 1.1 2.91.84.09-.65.35-1.1.63-1.35-2.22-.26-4.56-1.14-4.56-5.05 0-1.12.39-2.03 1.03-2.75-.1-.26-.45-1.31.1-2.73 0 0 .84-.27 2.75 1.05a9.3 9.3 0 0 1 5 0c1.9-1.32 2.74-1.05 2.74-1.05.55 1.42.2 2.47.1 2.73.64.72 1.03 1.63 1.03 2.75 0 3.92-2.34 4.79-4.57 5.04.36.32.68.94.68 1.9 0 1.37-.01 2.48-.01 2.82 0 .27.18.6.69.49A10.02 10.02 0 0 0 22 12.2C22 6.58 17.52 2 12 2Z"/>
            </svg>
          </span>
          Continue with GitHub
        </a>
      </div>

      <p class="signin-footer-text">
        Don't have an account? <a href="index.html" class="signin-footer-link">Create one</a>
      </p>

    </div>
  </main>

</body>
</html>
